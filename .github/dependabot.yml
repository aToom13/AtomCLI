version: 2
updates:
  # Root npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      ai-sdk:
        patterns:
          - "@ai-sdk/*"
          - "@openrouter/ai-sdk-provider"
      parcel:
        patterns:
          - "@parcel/*"
    ignore:
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentui/solid"
        update-types: ["version-update:semver-major"]

  # AtomBase package dependencies
  - package-ecosystem: "npm"
    directory: "/AtomBase"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    groups:
      ai-sdk:
        patterns:
          - "@ai-sdk/*"
          - "@openrouter/ai-sdk-provider"
      parcel:
        patterns:
          - "@parcel/*"
    ignore:
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentui/solid"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "ci"
      - "dependencies"
