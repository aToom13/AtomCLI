name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, test, and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check workspace version alignment
        run: bun run version:check

      - name: Prepare and verify execution sandbox
        run: bash .github/scripts/setup-linux-sandbox.sh

      - name: Typecheck monorepo
        run: bun turbo typecheck

      - name: Test monorepo
        run: bun turbo test
        env:
          ATOMCLI_TEST_HOME: ${{ runner.temp }}/atomcli-test-home
          ATOMCLI_TEST: "true"
          ATOMCLI_BASH_SANDBOX_BYPASS: "true"

      - name: Check generated SDK is current
        run: git diff --exit-code -- libs/sdk/js/src/v2/gen

      - name: Install Chromium runtime
        working-directory: AtomBase
        run: bunx --no-install playwright install --with-deps chromium

      - name: Test browser with real Chromium
        working-directory: AtomBase
        run: bun test test/tool/browser.test.ts
        env:
          ATOMCLI_BROWSER_E2E: "1"
          MODELS_DEV_API_JSON: test/tool/fixtures/models-api.json
          ATOMCLI_TEST: "true"
          ATOMCLI_BASH_SANDBOX_BYPASS: "true"

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Test installer checksum verification
        run: bash .github/scripts/test-install-sh.sh

      - name: Test Companion device smoke classifications
        run: bash .github/scripts/test-companion-device-smoke.sh

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Lint shell installer
        run: shellcheck --severity=error install.sh .github/scripts/test-install-sh.sh companion/tool/verify-android-device.sh .github/scripts/test-companion-device-smoke.sh

  android-companion:
    name: Android Companion
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Check Companion protocol codegen
        working-directory: libs/companion
        run: bun run protocol:check

      - name: Install Flutter dependencies
        working-directory: companion
        run: flutter pub get --enforce-lockfile

      - name: Analyze Companion
        working-directory: companion
        run: flutter analyze

      - name: Test Companion
        working-directory: companion
        run: flutter test

      - name: Test Companion bridge and protocol
        working-directory: libs/companion
        run: bun run test

      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm

      - name: Test real Android integration with concurrent AtomCLI processes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: cd companion && python3 tool/test_android_integration.py --device emulator-5554 --output "$RUNNER_TEMP/companion-integration"

      - name: Preserve Android integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-android-integration
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/companion-integration/android-integration.log
            ${{ runner.temp }}/companion-integration/android-integration.exit
            ${{ runner.temp }}/companion-integration/android-crash.log
            ${{ runner.temp }}/companion-integration/android-runtime.log
            ${{ runner.temp }}/companion-integration/a/server.log
            ${{ runner.temp }}/companion-integration/a/evidence.json
            ${{ runner.temp }}/companion-integration/b/server.log
            ${{ runner.temp }}/companion-integration/b/evidence.json

      - name: Build release APK
        working-directory: companion
        run: flutter build apk --release
