name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Validate release metadata
        run: |
          bun run version:check
          VERSION="$(bun -e 'console.log(require("./AtomBase/package.json").version)')"
          test "v${VERSION}" = "${GITHUB_REF_NAME}"
          echo "ATOMCLI_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "ATOMCLI_CHANNEL=debug" >> "${GITHUB_ENV}"
          else
            echo "ATOMCLI_CHANNEL=latest" >> "${GITHUB_ENV}"
          fi
          test -s RELEASE_NOTES.md
          test "$(sed -n '1p' RELEASE_NOTES.md)" = "# AtomCLI ${GITHUB_REF_NAME}"
          RELEASE_NOTES_FILE=RELEASE_NOTES.md bun -e '
            const text = await Bun.file(process.env.RELEASE_NOTES_FILE).text()
            if (/\p{Extended_Pictographic}/u.test(text)) {
              console.error("Release notes must not contain emoji")
              process.exit(1)
            }
          '

      - name: Validate source and protocol
        env:
          ATOMCLI_TEST_HOME: ${{ runner.temp }}/atomcli-test-home
        run: |
          bun turbo typecheck
          bun turbo test
          cd libs/companion
          bun run protocol:check
          cd ../..
          git diff --exit-code -- libs/sdk/js/src/v2/gen

      - name: Validate and build Android Companion
        working-directory: companion
        env:
          KEYSTORE_BASE64: ${{ secrets.ATOMCLI_ANDROID_KEYSTORE_BASE64 }}
          ATOMCLI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ATOMCLI_ANDROID_KEYSTORE_PASSWORD }}
          ATOMCLI_ANDROID_KEY_ALIAS: ${{ secrets.ATOMCLI_ANDROID_KEY_ALIAS }}
          ATOMCLI_ANDROID_KEY_PASSWORD: ${{ secrets.ATOMCLI_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "${KEYSTORE_BASE64}"
          test -n "${ATOMCLI_ANDROID_KEYSTORE_PASSWORD}"
          test -n "${ATOMCLI_ANDROID_KEY_ALIAS}"
          test -n "${ATOMCLI_ANDROID_KEY_PASSWORD}"
          export ATOMCLI_ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/atomcli-android-release.jks"
          trap 'rm -f "${ATOMCLI_ANDROID_KEYSTORE_PATH}"' EXIT
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${ATOMCLI_ANDROID_KEYSTORE_PATH}"
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
          flutter build apk --release
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APK_ANALYZER="${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -s "${APK}"
          MANIFEST="$(${APK_ANALYZER} manifest print "${APK}")"
          printf '%s\n' "${MANIFEST}" | grep -q "android:versionName=\"${ATOMCLI_VERSION}\""
          printf '%s\n' "${MANIFEST}" | grep -q 'android.permission.POST_PROMOTED_NOTIFICATIONS'
          CERTIFICATES="$(${APKSIGNER} verify --verbose --print-certs "${APK}")"
          printf '%s\n' "${CERTIFICATES}" | grep -q '^Verifies$'
          if printf '%s\n' "${CERTIFICATES}" | grep -q 'CN=Android Debug'; then
            echo 'Refusing to publish a debug-signed Android APK' >&2
            exit 1
          fi

      - name: Build
        run: |
          cd AtomBase
          bun run build

      - name: Rename and Prepare Release Assets
        run: |
          mkdir release_assets
          # Linux (glibc)
          cp AtomBase/dist/atomcli-linux-x64/bin/atomcli release_assets/atomcli-linux-x64
          cp AtomBase/dist/atomcli-linux-arm64/bin/atomcli release_assets/atomcli-linux-arm64
          # Linux (musl)
          cp AtomBase/dist/atomcli-linux-x64-musl/bin/atomcli release_assets/atomcli-linux-x64-musl
          cp AtomBase/dist/atomcli-linux-arm64-musl/bin/atomcli release_assets/atomcli-linux-arm64-musl
          # Linux (baseline - AVX2 olmayan eski CPU'lar)
          cp AtomBase/dist/atomcli-linux-x64-baseline/bin/atomcli release_assets/atomcli-linux-x64-baseline
          cp AtomBase/dist/atomcli-linux-x64-baseline-musl/bin/atomcli release_assets/atomcli-linux-x64-baseline-musl
          # macOS
          cp AtomBase/dist/atomcli-darwin-x64/bin/atomcli release_assets/atomcli-darwin-x64
          cp AtomBase/dist/atomcli-darwin-arm64/bin/atomcli release_assets/atomcli-darwin-arm64
          cp AtomBase/dist/atomcli-darwin-x64-baseline/bin/atomcli release_assets/atomcli-darwin-x64-baseline
          # Windows
          cp AtomBase/dist/atomcli-windows-x64/bin/atomcli.exe release_assets/atomcli-windows-x64.exe
          cp AtomBase/dist/atomcli-windows-arm64/bin/atomcli.exe release_assets/atomcli-windows-arm64.exe
          cp AtomBase/dist/atomcli-windows-x64-baseline/bin/atomcli.exe release_assets/atomcli-windows-x64-baseline.exe
          cp companion/build/app/outputs/flutter-apk/app-release.apk release_assets/atomcli-companion-android.apk

      - name: Prepare Bundled Skills Archives
        run: |
          # Embedded skills ship as archives so installers can fetch them
          # alongside the platform binary (the binary itself contains no skills).
          tar -czf release_assets/skills.tar.gz -C .atomcli skills
          (cd .atomcli && zip -qr ../release_assets/skills.zip skills)

      - name: Generate release checksums
        working-directory: release_assets
        run: sha256sum atomcli-* skills.tar.gz skills.zip > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release_assets/atomcli-linux-x64
            release_assets/atomcli-linux-arm64
            release_assets/atomcli-linux-x64-musl
            release_assets/atomcli-linux-arm64-musl
            release_assets/atomcli-linux-x64-baseline
            release_assets/atomcli-linux-x64-baseline-musl
            release_assets/atomcli-darwin-x64
            release_assets/atomcli-darwin-arm64
            release_assets/atomcli-darwin-x64-baseline
            release_assets/atomcli-windows-x64.exe
            release_assets/atomcli-windows-arm64.exe
            release_assets/atomcli-windows-x64-baseline.exe
            release_assets/atomcli-companion-android.apk
            release_assets/SHA256SUMS
            release_assets/skills.tar.gz
            release_assets/skills.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
