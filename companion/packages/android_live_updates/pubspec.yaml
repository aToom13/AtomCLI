environment:
  sdk: ^3.10.3
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.atomcli.live_updates
        pluginClass: AtomcliLiveUpdatesPlugin
